services:
  - type: web
    name: modelproof-rag
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BASE_URL
      - key: LLM_API_KEY
      - key: LLM_MODEL
    healthCheckPath: /health
